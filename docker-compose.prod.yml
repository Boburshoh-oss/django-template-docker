

services:
  migrate:
    build:
      context: .
      dockerfile: ./devops/backend/Dockerfile
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    env_file: ./.env
    command: python manage.py migrate --no-input
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: ./devops/backend/Dockerfile
    init: true
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    env_file: ./.env
    command: >
      uvicorn config.asgi:application
      --app-dir .
      --host 0.0.0.0
      --port 8000
      --workers 4
      --proxy-headers
      --forwarded-allow-ips=*
    networks:
      - backend
    expose:
      - 8000
    volumes:
      - static_volume:/code/backend/staticfiles
      - media_volume:/code/backend/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  db:
    image: postgres:18-alpine
    container_name: db
    restart: always
    networks:
      - backend
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: always
    networks:
      - backend
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    build:
      context: .
      dockerfile: ./devops/nginx/Dockerfile
    restart: always
    networks:
      - backend
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - static_volume:/code/backend/staticfiles
      - media_volume:/code/backend/media
      - ./frontend:/frontend
    depends_on:
      web:
        condition: service_started

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:

