

services:
  web:
    build: 
      context: .
      dockerfile: ./devops/backend/Dockerfile
    init: true
    restart: unless-stopped
    entrypoint: /code/devops/backend/server-entrypoint.sh
    env_file:
      - ./.env
    networks:
      - backend
    expose:
      - 8000
    volumes:
      - static_volume:/code/backend/staticfiles
      - media_volume:/code/backend/media
      # - .:/code
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    container_name: db
    restart: always
    networks:
      - backend
    environment:
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    
    expose:
      - 5433
    
    ports:
      - "5433:5432"
  

  nginx:
    build:
      context: .
      dockerfile: ./devops/nginx/Dockerfile
    restart: always
    networks:
      - backend
    ports:
      - ${NGINX_PORT}:80
    volumes:
      - static_volume:/code/backend/staticfiles
      - media_volume:/code/backend/media
      - ./frontend:/frontend
    depends_on:
      web:
        condition: service_started

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
  static_volume:
  media_volume:
