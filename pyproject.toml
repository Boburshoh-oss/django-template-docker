[project]
name = "django-template"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "django>=5.1",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.4",
    "drf-spectacular>=0.28",
    "drf-standardized-errors>=0.14",
    "django-cors-headers>=4.7",
    "django-filter>=24.3",
    "django-redis>=5.4",
    "django-modeltranslation>=0.19",
    "psycopg[binary,pool]>=3.2",
    "uvicorn[standard]>=0.34",
    "gunicorn>=23.0",
    "whitenoise[brotli]>=6.9",
    "python-dotenv>=1.1",
    "Pillow>=11.2",
    "python-dateutil>=2.9",
    "sentry-sdk[django]>=2.25",
    "ujson>=5.10",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = [
    "django-debug-toolbar>=5.1",
    "factory-boy>=3.3",
    "faker>=37.0",
    "pytest>=8.3",
    "pytest-django>=4.10",
    "pytest-cov>=6.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.development"
pythonpath = ["backend"]
testpaths = ["backend"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--reuse-db -v"
